services:
  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  seeder:
    build:
      context: .
      dockerfile: seeder/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    volumes:
      - kagglehub-cache:/home/app/.cache/kagglehub

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMINER_PORT}:8080"

volumes:
  pgdata:
  kagglehub-cache:
