[project]
name = "iris-api"
version = "0.1.0"
description = "Read-only Flask REST API for the Iris dataset"
requires-python = ">=3.12"
dependencies = [
    "iris-common",
    "flask>=3",
    "pydantic>=2",
    "pydantic-settings",
    "gunicorn",
]

[tool.uv.sources]
iris-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_api"]
