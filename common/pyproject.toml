[project]
name = "iris-common"
version = "0.1.0"
description = "Shared SQLAlchemy model and database helpers for Iris Explorer"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_common"]
