[project]
name = "iris-seeder"
version = "0.1.0"
description = "One-shot job that loads the Iris dataset into PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "iris-common",
    "pydantic>=2",
    "pydantic-settings",
    "kagglehub",
]

[project.scripts]
iris-seed = "iris_seeder.__main__:main"

[tool.uv.sources]
iris-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_seeder"]
