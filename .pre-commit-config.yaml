repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$ # tsconfig allows comments
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      # ruff runs through uv so the hook uses the version pinned in uv.lock
      - id: ruff
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (strict)
        entry: uv run --locked mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: frontend-lint
        name: eslint + prettier (frontend)
        entry: >-
          bash -c 'cd frontend || exit 1;
          [ -f package.json ] || exit 0;
          [ -d node_modules ] || { echo "frontend/node_modules missing: run make setup" >&2; exit 1; };
          npm run lint && npm run format:check'
        language: system
        files: ^frontend/
        pass_filenames: false
